packages:
  - "apps/*"
  - "packages/*"

# Security patches for transitive runtime and build-tool dependencies.
overrides:
  "shell-quote@<1.8.4": "1.8.4"
  "tar@>=7.0.0 <7.5.19": "7.5.19"
  "axios@>=1.0.0 <1.20.0": "1.20.0"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "undici@>=6.0.0 <6.28.0": "6.28.0"
  "undici@>=7.0.0 <7.29.1": "7.29.1"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "electron"
  - "prisma"
